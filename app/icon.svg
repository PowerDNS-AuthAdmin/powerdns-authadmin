<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><!--
  The `{}` mark is drawn as stroked paths, never as <text>. An SVG favicon that
  renders its glyph with font-family="monospace" is at the mercy of whatever
  font the browser's icon rasterizer resolves: Firefox picked one and looked
  right, Safari picked another and the braces came out cramped and misaligned.
  Paths carry their own geometry, so every browser rasterizes identically.
  No width/height attributes - the viewBox alone lets it scale to whatever box
  the consumer gives it (16px tab, 128px bookmark tile).
--><g fill="none" stroke="#4f8ef7" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4.5c-3.2 0-3.2 2.2-3.2 5.5s-1.8 5-4.3 6c2.5 1 4.3 2.7 4.3 6s0 5.5 3.2 5.5"/><path d="M18.5 4.5c3.2 0 3.2 2.2 3.2 5.5s1.8 5 4.3 6c-2.5 1-4.3 2.7-4.3 6s0 5.5-3.2 5.5"/></g></svg>
